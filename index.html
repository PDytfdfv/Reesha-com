<style>

.bgbtn{margin-top:auto}
.bgbtn span{width:34px;height:34px;border-radius:50%;border:3px solid #cfd0d6;display:block}.p-background .pop-in{right:96px;bottom:28px;width:min(250px,calc(100% - 120px));padding:12px}.bgmenu{display:flex;flex-direction:column;gap:7px}.bgopt{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;background:var(--s2);text-align:right}.bgopt:active{background:var(--s3)}.bgdot{width:30px;height:30px;border-radius:8px;border:2px solid #bfc0c8;flex:none}.bgcolorrow{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;background:var(--s2)}.bgcolorrow input[type=color]{width:42px;height:34px;padding:0;border:0;background:none;border-radius:8px}.bgsmall{font-size:11px;color:var(--dim);display:block;margin-top:2px}.bgpicker{width:min(330px,calc(100% - 120px))}.bgpicker #bg-wheel{width:100%;height:auto;display:block;touch-action:none}.bgpicker .ctabs button{flex:1}.bg-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.bg-native{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:var(--s2);padding:8px 10px;border-radius:10px;font-size:12px}.bg-native input{width:48px;height:32px;padding:0;border:0;background:none}

.p3d-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.p3d-head h4{margin:0}.p3d-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0 10px}.p3d-tabs button{border:0;border-radius:9px;background:var(--s2);color:var(--fg);padding:8px 5px;font:inherit;font-size:11px}.p3d-tabs button.on{background:var(--acc);color:#fff}.p3d-section{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.045);border-radius:12px;padding:9px;margin:7px 0}.p3d-section h5{margin:0 0 7px;font-size:11px}.p3d-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.p3d-presets button{border:1px solid var(--line);background:var(--s2);color:var(--fg);border-radius:9px;padding:7px 3px;font-size:10px}.p3d-presets button.on{outline:2px solid var(--acc)}.p3d-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border-radius:9px;padding:7px 9px;margin-top:6px;font-size:11px}.p3d-gizmo{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.p3d-gizmo button{border:1px solid var(--line);background:var(--s2);color:var(--fg);border-radius:9px;padding:7px;font-size:10px}.p3d-note{font-size:10px;line-height:1.45;color:var(--dim);margin:7px 2px}.p3d-mini{font-size:10px;color:var(--dim)}.p3d-axis{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.p3d-axis button{padding:7px 4px;border-radius:8px;background:var(--s2);border:1px solid var(--line);font-size:10px}.p3d-axis button:active{background:var(--s3)}

h4{margin:2px 4px 12px;font-size:17px;font-weight:600}

 .libsearch{display:flex;gap:7px;padding:0 4px 9px;direction:rtl}.libsearch input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--s2);color:var(--fg);padding:0 12px;font:inherit;outline:none}.libsearch input:focus{border-color:var(--acc)}.libsearch .searchcount{min-width:58px;height:40px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--dim);font-size:12px}.cats .catall{margin-bottom:5px;border-bottom:1px solid var(--line);padding-bottom:6px}.brow .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

}

  const m=mul(T(c.x,c.y),mul(Ro(da),T(-c.x,-c.y)));

/* ===== Object clipping masks ===== */
function makeObjectMask(){
  const fs=itemsSel();
  if(fs.length<2)return toast('حدد شكل القناع + شكل واحد على الأقل');
  const same=fs.every(f=>f.L===fs[0].L);
  if(!same)return toast('قناع العناصر لازم يكون داخل نفس الطبقة');
  const L=fs[0].L;
  const base=fs[0].it;
  if(base.erase)return toast('اختَر شكلًا عاديًا كقناع');
  const ids=new Set(fs.slice(1).map(f=>f.it.id));
  for(const it of L.items){if(ids.has(it.id)){it.clipTo=base.id;}if(it.id===base.id)it.clipMask=true;}
  selectIds(fs.slice(1).map(f=>f.it.id));commit();render();renderLayers();toast('تم إنشاء Object Clipping Mask');
}
function releaseObjectMask(){
  const fs=itemsSel();if(!fs.length)return toast('حدد عنصرًا داخل قناع العناصر');
  const L=fs[0].L,ids=new Set(fs.map(f=>f.it.id));let base=null,changed=false;
  for(const it of L.items)if(ids.has(it.id)&&it.clipTo){base=it.clipTo;it.clipTo=null;changed=true;}
  if(base){const b=L.items.find(it=>it.id===base);if(b){b.clipMask=false;changed=true;}}
  if(changed){commit();render();renderLayers();toast('تم فك Object Clipping Mask');}else toast('العنصر المحدد مش داخل قناع عناصر');
}

/* ================= advanced vector tools ================= */
function smoothSelected(){
  if(!S.sel.length)return toast('حدد مسارًا أولًا');
  let changed=false;
  for(const f of itemsSel()) for(const sub of (f.it.subs||[])){
    const P=sub.p;if(P.length<3)continue;
    const old=P.map(q=>clone(q));
    for(let i=1;i<P.length-1;i++){
      const a=old[i-1],b=old[i],c=old[i+1];
      b.x=(a.x+b.x+c.x)/3;b.y=(a.y+b.y+c.y)/3;
      b.ix=b.x+(old[i].ix-old[i].x);b.iy=b.y+(old[i].iy-old[i].y);
      b.ox=b.x+(old[i].ox-old[i].x);b.oy=b.y+(old[i].oy-old[i].y);
    }
    changed=true;
  }
  if(changed){commit();render();drawUI();}
}
function joinSelected(){
  const fs=itemsSel();if(fs.length!==2)return toast('حدد مسارين للوصل');

function symbolAffectAt(p,mode){

function nearestSelNode(p){

function deformAt(p,mode){
  let changed=false;
  for(const f of itemsSel()){
    if(f.L.lock)continue;
    for(const sub of f.it.subs||[]){
      for(const q of sub.p||[]){

function objectAlign(a){
  const fs=itemsSel();
  if(fs.length<2)return toast('حدد شكلين أو أكثر للمحاذاة');
  const bs=fs.map(f=>({f,b:subsBounds(f.it.subs)})).filter(x=>x.b);
  if(bs.length<2)return;
  const all={x0:Math.min(...bs.map(x=>x.b.x0)),y0:Math.min(...bs.map(x=>x.b.y0)),x1:Math.max(...bs.map(x=>x.b.x1)),y1:Math.max(...bs.map(x=>x.b.y1))};
  const targets={left:all.x0,right:all.x1,top:all.y0,bottom:all.y1,centerX:(all.x0+all.x1)/2,centerY:(all.y0+all.y1)/2};
  if(a.startsWith('dist')){
    const axis=a==='distX'?'x':'y', sorted=bs.slice().sort((u,v)=>u.b[axis+'0']-v.b[axis+'0']);
    if(sorted.length<3)return toast('التوزيع يحتاج 3 عناصر على الأقل');
    const first=sorted[0].b[axis+'0'],last=sorted.at(-1).b[axis+'1'],total=sorted.reduce((n,x)=>n+(x.b[axis+'1']-x.b[axis+'0']),0),gap=(last-first-total)/(sorted.length-1);
    let cursor=first;
    for(const x of sorted){const len=x.b[axis+'1']-x.b[axis+'0'];const target=cursor;const d=target-x.b[axis+'0'];const m=axis==='x'?T(d,0):T(0,d);x.f.it.subs=xformSubs(x.f.it.subs,m);xformGrad(x.f.it,m);cursor=target+len+gap;}
  }else{
    for(const x of bs){let d=0;
      if(a==='left')d=targets.left-x.b.x0;
      else if(a==='right')d=targets.right-x.b.x1;
      else if(a==='top')d=targets.top-x.b.y0;
      else if(a==='bottom')d=targets.bottom-x.b.y1;
      else if(a==='centerX')d=targets.centerX-(x.b.x0+x.b.x1)/2;
      else if(a==='centerY')d=targets.centerY-(x.b.y0+x.b.y1)/2;
      {const mm=a==='left'||a==='right'||a==='centerX'?T(d,0):T(0,d);x.f.it.subs=xformSubs(x.f.it.subs,mm);xformGrad(x.f.it,mm);}
    }
  }
  commit();render();renderLayers();drawUI();toast('تمت محاذاة العناصر');
}

function cubicPoint(a,b,t){
  const u=1-t,uu=u*u,tt=t*t;

    for(let k=0;k<=steps;k++){

      if(!best||d<best.d)best={i,j,t,d};
    }
  }

}
function nodeAction(a){
  const f=S.sel.length===1&&findItem(S.sel[0]);
  if(!f)return toast('حدد مسارًا أولًا');
  const subs=f.it.subs||[];
  if(a==='nAdd'&&!S.node){
    const p=S.lastDoc;
    if(!p)return toast('اضغط على المسار أولًا ثم اختر إضافة نقطة');
    let best=null;
    subs.forEach((sub,si)=>{const r=nearestPathSegment(sub,p);if(r&&(!best||r.d<best.d))best={...r,si};});
    const tol=12/Math.max(.2,V.z);
    if(!best||best.d>tol)return toast('اضغط قريبًا من المسار لإضافة نقطة');
    const s=subs[best.si],P=s.p,n=P.length,i=best.i,j=(i+1)%n;
    const r=splitSeg(P[i],P[j],best.t);
    Object.assign(P[i],r.a);Object.assign(P[j],r.b);P.splice(i+1,0,r.n);
    S.node={si:best.si,pi:i+1};S.nodeMode=null;commit();render();drawUI();toast('تمت إضافة نقطة على المسار');return;
  }

  }

  const P=s.p,i=Math.max(0,Math.min(S.node.pi,P.length-1)),q=P[i],n=P.length;
  if(a==='nDel'){
    if(n<=2){toast('المسار محتاج نقطتين على الأقل');return;}

  }else if(a==='nCorner'){

  }else if(a==='nAdd'){
    if(!s.c&&i===n-1)return toast('اختر نقطة قبل القطعة اللي عايز تقسمها');
    const j=(i+1)%n,r=splitSeg(P[i],P[j],.5);
    Object.assign(P[i],r.a);Object.assign(P[j],r.b);P.splice(i+1,0,r.n);S.node={si:S.node.si,pi:i+1};
  }

}

/* ---- import brushes (.przp / .prbr / .svg) ---- */
async function headLayers(u8){
  let bmp;
  try{bmp=await createImageBitmap(new Blob([u8],{type:'image/png'}));}
  catch(_){
    bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(new Blob([u8],{type:'image/png'})),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im);};im.onerror=()=>rej(new Error('img'));im.src=u;});
  }
  const N=256,c=document.createElement('canvas');c.width=c.height=N;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data,cls={};let tot=0;
  for(let i=0;i<N*N;i++){
    const a=d[i*4+3];if(a<24)continue;
    const lum=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255,key=Math.round(lum*3)+'_'+Math.round(a/255*4);
    const c0=cls[key]||(cls[key]={n:0,lum:0,a:0,pts:[]});
    c0.n++;c0.lum+=lum;c0.a+=a/255;tot++;
    if(c0.pts.length<40000)c0.pts.push([i%N,(i/N)|0]);
  }
  let arr=Object.values(cls).filter(k=>k.n>=tot*0.04).sort((a,b)=>b.n-a.n).slice(0,4);
  if(!arr.length)return [];
  const out=arr.map(k=>{
    let H=convexHull(k.pts.map(p=>[p[0]+.5,p[1]+.5]));H=simplifyHull(H,44);
    return {hull:H.map(p=>[(p[0]-N/2)/N,(p[1]-N/2)/N]),lum:k.lum/k.n,alpha:Math.min(1,k.a/k.n)};
  });
  out.sort((a,b)=>a.alpha-b.alpha||b.lum-a.lum);
  return out;
}
async function presetFromPrbr(files,cat){
  const props=JSON.parse(TD.decode(files['properties.json']));
  const st=props['stroke-properties']||{},hd=props['head-properties']||{},dy=props['dynamics-properties']||{};
  const p={id:rid(),name:props['display-name']||'فرشاة',cat,size:st['paint-size']||40,opacity:st['paint-opacity']>0.05?st['paint-opacity']:1,
    stab:Math.min(0.9,(st['lazy-stroke']||0.5)*0.85),

    taper:{on:!!st['has-size-profile'],pts:st['size-profile']||[0,0,1,1]},taperLen:2.5,
    pressureSize:{on:!!dy['pressure - effects size'],pts:dy['pressure profile - size']||[0,1,1,1]}};
  if(files['preview'])p.preview='data:image/png;base64,'+ab2b64(u8buf(files['preview']));

async function importBrushFile(file){

    try{
      const items=importSVGText(await file.text());
      const tip=normalizeTip(items.flatMap(i=>i.subs));if(!tip.length)throw 0;
      const p={id:rid(),name:nm.replace(/\.svg$/i,''),cat:'أختام SVG',kind:'stamp',tip,size:40,spacing:40,rot:'follow',jitter:0,opacity:1,stab:.3,pressure:false,taper:false};
      addUserPreset(p);return [p];
    }catch(_){toast('تعذّر قراءة الفرشاة: '+nm);return [];}
  }
  try{
    const files=await zipRead(await file.arrayBuffer()),out=[];
    if(files['properties.json']){
      const p=await presetFromPrbr(files,'مستوردة');addUserPreset(p);return [p];
    }
    let cat=nm.replace(/\.(przp|zip)$/i,''),order=null;
    if(files['index.json']){
      try{const ix=JSON.parse(TD.decode(files['index.json'])),f=ix['brush-folders'][0];if(f.name)cat=f.name;order=f.brushes.map(b=>b.name);}catch(_){}
    }

    if(order)names.sort((a,b)=>{const ia=order.indexOf(a.replace(/^Brushes\//,'').replace(/\.prbr$/i,'')),ib=order.indexOf(b.replace(/^Brushes\//,'').replace(/\.prbr$/i,''));return (ia<0?999:ia)-(ib<0?999:ib);});

}

function openPop(name){if(S.sedit&&name==='export')seCommit();if(S.tedit&&name==='export')teCommit();

  const el=$('#pop');el.className='p-'+name;el.innerHTML=popHTML(name);$('#scrim').classList.add('on');

  else if(id==='bg-color'){S.doc.bg=e.target.value;const p=$('#bg-preview');if(p)p.style.background=e.target.value;const h=$('#bg-hex');if(h)h.value=e.target.value;const c=$('#bg-cbar');if(c)c.style.background=e.target.value;render();renderLayers();commit();}

$('#pop').addEventListener('click',e=>{
  const t=e.target;

  if((b=t.closest('[data-nt]'))){newBrushFrom(b.dataset.nt);return;}
  if((b=t.closest('[data-sy]'))){S.sym=b.dataset.sy;syncToolbar();drawUI();openPop('sym');return;}
  if((b=t.closest('[data-gadd]'))){addGuide(b.dataset.gadd);return;}
  if((b=t.closest('[data-gtog]'))){const g=gById(b.dataset.gtog);if(g)g.vis=g.vis===false;drawUI();openPop('guides');return;}
  if((b=t.closest('[data-gdel]'))){S.guides=S.guides.filter(g=>g.id!==b.dataset.gdel);if(S.gsel===b.dataset.gdel)S.gsel=null;drawUI();renderBar();openPop('guides');return;}
  if((b=t.closest('[data-gid]'))){S.gsel=b.dataset.gid;drawUI();renderBar();openPop('guides');return;}
  if((b=t.closest('[data-so]'))){const [k2,v2]=b.dataset.so.split(':');S.selo[k2]=v2;if(S.region)selectByRegion(false);renderBar();openPop('selopts');return;}
  if((b=t.closest('[data-fav]'))){const id=b.dataset.fav;S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):S.fav.concat(id);openPop('brush-lib');return;}
  if((b=t.closest('[data-pid]'))){selectPreset(findPreset(b.dataset.pid),true);closePop();return;}
  if((b=t.closest('[data-cat]'))){S.catSel=b.dataset.cat;openPop('brush-lib');return;}
  if((b=t.closest('[data-ct]'))){S.colorTarget=b.dataset.ct;openPop('color');return;}
  if((b=t.closest('[data-col]'))){const c=b.dataset.col;setColor(c,true);$('#hexIn').value=c;$('#cbar').style.background=c;wheelDraw();return;}
  if((b=t.closest('[data-assist]'))){S.assist.mode=b.dataset.assist;S.assist.on=b.dataset.assist!=='none';openPop('drawing-assist');drawUI();return;}
  if((b=t.closest('[data-tab]'))){S.toolsTab=b.dataset.tab;openPop('tools');return;}
  if((b=t.closest('[data-tt]'))){
    const act=b.dataset.act,tt=b.dataset.tt;
    if(tt){setTool(tt);closePop();if(tt==='text')openPop('text');return;}
    if(act&&act.startsWith('sym-')){S.sym=act.slice(4);syncToolbar();openPop('tools');return;}
    if(act==='mixer'){openPop('mixer');return;}
    if(act&&advancedToolAction(act)){return;}
    if(act==='fit'){closePop();fitView();}
    else if(act==='rotlock'){S.rotLock=!S.rotLock;toast(S.rotLock?'دوران اللوحة مقفول':'دوران اللوحة شغال');openPop('tools');}
    else if(act==='rot0'){closePop();resetRotation();}
    else if(act==='flipview'){closePop();const b=svg.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,p=toDoc(cx,cy);V.f*=-1;setCenterFor(p,cx,cy);applyView();drawUI();}
    else if(act==='sympop'){openPop('sym');}
    else if(act==='selall'){closePop();selectAllObjs();setTool('select');}
    else if(act==='selinv'){closePop();invertSelObjs();setTool('select');}
    else if(act==='xfnum'){setTool('select');openPop('xfnum');}
    else if(act==='touchpan'){S.touchPan=!S.touchPan;toast(S.touchPan?'الإصبع بيحرّك اللوحة، والقلم بيرسم':'الإصبع بيرسم');openPop('tools');}
    else if(act==='multi'){S.multi=!S.multi;setTool('select');openPop('tools');}
    else if(act==='dup'){dupSel();}else if(act==='flipH'){flipSel(true);}else if(act==='flipV'){flipSel(false);}
    else if(act==='front'){orderSel(true);}else if(act==='back'){orderSel(false);}else if(act==='del'){deleteSel();}
    else if(act==='mkstamp'){closePop();stampFromSel();}
    else if(act==='colorsel'){openPop('color');}
    else if(act==='board'){closePop();setArtboard();}
    else if(act==='layers'){closePop();$('#ls').classList.remove('hide');}
    return;
  }
  if((b=t.closest('[data-oa]'))){

/* --- colour wheel --- */
let wheelRing=null,wheelMode=null,bgWheelRing=null,bgWheelMode=null;
function initBgWheel(){
  const c=$('#bg-wheel');if(!c)return;
  const cur=S.doc.bg==='none'?'#ffffff':(normColor(S.doc.bg)||'#ffffff');
  let hsv=hex2hsv(cur);S.bgHsv=hsv;
  bgWheelRing=document.createElement('canvas');bgWheelRing.width=bgWheelRing.height=300;
  const x=bgWheelRing.getContext('2d');
  for(let a=0;a<360;a++){x.beginPath();x.arc(150,150,138,(a-1)*Math.PI/180,(a+1.5)*Math.PI/180);x.arc(150,150,108,(a+1.5)*Math.PI/180,(a-1)*Math.PI/180,true);x.closePath();x.fillStyle=`hsl(${a},100%,50%)`;x.fill();}
  const draw=()=>{const g=c.getContext('2d');g.clearRect(0,0,300,300);g.drawImage(bgWheelRing,0,0);const half=74,sx=76,sy=76;g.fillStyle=`hsl(${hsv.h},100%,50%)`;g.fillRect(sx,sy,148,148);let q=g.createLinearGradient(sx,0,sx+148,0);q.addColorStop(0,'#fff');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(sx,sy,148,148);q=g.createLinearGradient(0,sy,0,sy+148);q.addColorStop(0,'rgba(0,0,0,0)');q.addColorStop(1,'#000');g.fillStyle=q;g.fillRect(sx,sy,148,148);const ha=hsv.h*Math.PI/180,hx=150+123*Math.cos(ha),hy=150+123*Math.sin(ha);g.lineWidth=3;g.strokeStyle='#fff';g.beginPath();g.arc(hx,hy,11,0,7);g.stroke();g.fillStyle=`hsl(${hsv.h},100%,50%)`;g.fill();const px=sx+hsv.s*148,py=sy+(1-hsv.v)*148;g.beginPath();g.arc(px,py,10,0,7);g.strokeStyle='#fff';g.stroke();g.lineWidth=1.5;g.strokeStyle='#000';g.beginPath();g.arc(px,py,12.5,0,7);g.stroke();};
  draw();
  const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*300/r.width,y:(e.clientY-r.top)*300/r.height};};
  const upd=e=>{const p=pos(e),dx=p.x-150,dy=p.y-150;if(bgWheelMode==='h')hsv.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;else{hsv.s=Math.max(0,Math.min(1,(dx+74)/148));hsv.v=1-Math.max(0,Math.min(1,(dy+74)/148));}const hex=hsv2hex(hsv.h,hsv.s,hsv.v);S.doc.bg=hex;const hi=$('#bg-hex');if(hi)hi.value=hex;const cb=$('#bg-cbar');if(cb)cb.style.background=hex;const bp=$('#bg-preview');if(bp)bp.style.background=hex;render();renderLayers();draw();};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);const p=pos(e);bgWheelMode=Math.hypot(p.x-150,p.y-150)>100?'h':'sv';upd(e);};c.onpointermove=e=>{if(bgWheelMode)upd(e);};c.onpointerup=()=>{bgWheelMode=null;commit();};c.onpointercancel=()=>{bgWheelMode=null;};
}
function initWheel(){
  const c=$('#wheel');if(!c)return;
  const cur=S.colorTarget==='fill'?S.st.fill:S.st.stroke;S.hsv=hex2hsv(cur);
  wheelRing=document.createElement('canvas');wheelRing.width=wheelRing.height=300;
  const x=wheelRing.getContext('2d');
  for(let a=0;a<360;a+=1){x.beginPath();x.arc(150,150,138,(a-1)*Math.PI/180,(a+1.5)*Math.PI/180);x.arc(150,150,108,(a+1.5)*Math.PI/180,(a-1)*Math.PI/180,true);x.closePath();x.fillStyle=`hsl(${a},100%,50%)`;x.fill();}
  wheelDraw();
  const pos=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*300/r.width,y:(e.clientY-r.top)*300/r.height};};
  const upd=e=>{
    const p=pos(e),dx=p.x-150,dy=p.y-150;
    if(wheelMode==='h'){S.hsv.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;}
    else if(wheelMode==='sv'){const half=74;S.hsv.s=Math.max(0,Math.min(1,(dx+half)/(2*half)));S.hsv.v=1-Math.max(0,Math.min(1,(dy+half)/(2*half)));}
    const hex=hsv2hex(S.hsv.h,S.hsv.s,S.hsv.v);setColor(hex,false);$('#hexIn').value=hex;$('#cbar').style.background=hex;wheelDraw();
  };
  c.addEventListener('pointerdown',e=>{
    c.setPointerCapture(e.pointerId);const p=pos(e),d=Math.hypot(p.x-150,p.y-150);
    wheelMode=d>100?'h':'sv';upd(e);
  });
  c.addEventListener('pointermove',e=>{if(wheelMode)upd(e);});
  const end=()=>{if(wheelMode){wheelMode=null;setColor(hsv2hex(S.hsv.h,S.hsv.s,S.hsv.v),true);}};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function wheelDraw(){
  const c=$('#wheel');if(!c||!wheelRing)return;const x=c.getContext('2d');
  const cur=S.colorTarget==='fill'?S.st.fill:S.st.stroke;if(!wheelMode)S.hsv=hex2hsv(cur);
  x.clearRect(0,0,300,300);x.drawImage(wheelRing,0,0);
  const half=74,sx=150-half,sy=150-half;
  x.fillStyle=`hsl(${S.hsv.h},100%,50%)`;x.fillRect(sx,sy,half*2,half*2);
  let g=x.createLinearGradient(sx,0,sx+half*2,0);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(sx,sy,half*2,half*2);
  g=x.createLinearGradient(0,sy,0,sy+half*2);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(sx,sy,half*2,half*2);
  const ha=S.hsv.h*Math.PI/180,hx=150+123*Math.cos(ha),hy=150+123*Math.sin(ha);
  x.lineWidth=3;x.strokeStyle='#fff';x.beginPath();x.arc(hx,hy,11,0,7);x.stroke();x.fillStyle=`hsl(${S.hsv.h},100%,50%)`;x.fill();
  const px=sx+S.hsv.s*half*2,py=sy+(1-S.hsv.v)*half*2;
  x.beginPath();x.arc(px,py,10,0,7);x.strokeStyle='#fff';x.stroke();x.lineWidth=1.5;x.strokeStyle='#000';x.beginPath();x.arc(px,py,12.5,0,7);x.stroke();
}

/* ---- smudge = push/bend real vector nodes (no pixel mixing) ---- */
function subdivideNear(s,p,r){
  const P=s.p;
  for(let pass=0;pass<4&&P.length<6000;pass++){
    let any=false;const n=P.length,last=s.c?n:n-1;
    for(let i=last-1;i>=0;i--){
      const a=P[i],b=P[(i+1)%n],len=Math.hypot(b.x-a.x,b.y-a.y);
      if(len<=r*0.45)continue;
      if(Math.hypot((a.x+b.x)/2-p.x,(a.y+b.y)/2-p.y)>r*1.3+len/2)continue;
      const rr=splitSeg(a,b,.5);Object.assign(a,rr.a);Object.assign(b,rr.b);P.splice(i+1,0,rr.n);any=true;
    }
    if(!any)break;
  }
}
function smudgePush(L,p,dx,dy,r,str,hard){
  let changed=false;const ex=0.6+hard*2.2;
  for(const it of L.items){
    if(it.erase||!it.subs.length)continue;
    const b=subsBounds(it.subs);if(!b||b.x1<p.x-r||b.x0>p.x+r||b.y1<p.y-r||b.y0>p.y+r)continue;
    let hit=false;
    for(const s of it.subs){
      subdivideNear(s,p,r);
      for(const q of s.p){
        const d=Math.hypot(q.x-p.x,q.y-p.y);if(d>=r)continue;
        const w=str*Math.pow(1-d/r,ex);if(w<0.001)continue;
        const mx=dx*w,my=dy*w;q.x+=mx;q.y+=my;q.ix+=mx;q.iy+=my;q.ox+=mx;q.oy+=my;hit=true;
      }
    }
    if(hit){changed=true;if(it.txt)it.txt=null;}
  }
  return changed;
}
function smudgeDown(e){
  const L=targetLayer();if(!canDraw(L))return toast(drawMsg(L));
  S.drag={k:'smudge',last:toDoc(e.clientX,e.clientY),moved:false};
}
function smudgeMove(e){
  const d=S.drag,p=toDoc(e.clientX,e.clientY),dx=p.x-d.last.x,dy=p.y-d.last.y;
  gLive.innerHTML=`<circle cx="${p.x}" cy="${p.y}" r="${S.sm.size/2}" fill="none" stroke="#e5566b" stroke-width="${1.5/V.z}" pointer-events="none"/>`;
  if(Math.hypot(dx,dy)*V.z<2)return;
  if(smudgePush(targetLayer(),p,dx,dy,S.sm.size/2,S.sm.strength,S.sm.hardness)){d.moved=true;render();}
  d.last=p;
}
function smudgeUp(){
  const d=S.drag;S.drag=null;gLive.innerHTML='';
  if(d&&d.moved){commit();render();renderLayers();}
}

/* ================= Pixel -> Vector ================= */
let _imageTracerPromise=null;
function loadImageTracer(){
  if(window.ImageTracer)return Promise.resolve(window.ImageTracer);
  if(_imageTracerPromise)return _imageTracerPromise;
  _imageTracerPromise=new Promise((resolve,reject)=>{
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js';
    sc.onload=()=>window.ImageTracer?resolve(window.ImageTracer):reject(new Error('محرك التحويل لم يتم تحميله'));
    sc.onerror=()=>reject(new Error('تعذّر تحميل محرك Pixel → Vector'));
    document.head.appendChild(sc);
  });
  return _imageTracerPromise;
}
function vectorNoiseClean(items,level=65){
  if(!items.length||level<=0)return items;
  const info=items.map((item,index)=>({item,index,b:subsBounds(item.subs)})).filter(x=>x.b);
  if(!info.length)return items;
  const areas=info.map(x=>Math.max(0,(x.b.x1-x.b.x0)*(x.b.y1-x.b.y0))).sort((a,b)=>b-a);
  const mainArea=areas[0]||1;
  const threshold=Math.max(3,mainArea*(0.00008+0.0012*(level/100)));
  const gapLimit=Math.max(3,Math.sqrt(mainArea)*(0.018+0.045*(level/100)));
  const large=info.filter(x=>((x.b.x1-x.b.x0)*(x.b.y1-x.b.y0))>=mainArea*0.002);
  const gap=(a,b)=>{const dx=Math.max(a.x0-b.x1,b.x0-a.x1,0),dy=Math.max(a.y0-b.y1,b.y0-a.y1,0);return Math.hypot(dx,dy);};
  const keep=new Set();
  for(const x of info){
    const area=Math.max(0,(x.b.x1-x.b.x0)*(x.b.y1-x.b.y0));
    if(area>=threshold){keep.add(x.index);continue;}
    const near=large.some(y=>y.index!==x.index&&gap(x.b,y.b)<=gapLimit);
    if(near)keep.add(x.index);
  }
  return items.filter((_,i)=>keep.has(i));
}
function vectorizeSVGIntoLayer(svgText,name){
  let items=importSVGText(svgText);
  if(!items.length)throw new Error('لم يتم استخراج مسارات من الصورة');
  const before=items.length;
  items=vectorNoiseClean(items,Math.max(0,Math.min(100,+S.pvClean==null?65:S.pvClean)));
  if(!items.length)throw new Error('تم تنظيف جميع المسارات');
  const b=subsBounds(items.flatMap(i=>i.subs));
  const bw=Math.max(1,b.x1-b.x0),bh=Math.max(1,b.y1-b.y0);
  const s=Math.min(1,S.doc.w*0.88/bw,S.doc.h*0.88/bh);
  const m=mul(T(S.doc.w/2,S.doc.h/2),mul(Sc(s,s),T(-(b.x0+b.x1)/2,-(b.y0+b.y1)/2)));
  const L=addLayer(name||'Pixel → Vector');
  items.forEach(i=>{i.subs=xformSubs(i.subs,m);xformGrad(i,m);if(i.stroke)i.sw*=s;L.items.push(i);});
  S.cur=L.id;S.sel=L.items.map(i=>i.id);commit();render();renderLayers();setTool('select');renderBar();drawUI();
  return L;
}
async function pixelToVector(){
  const L=curLayer();
  if(!L||L.kind!=='image'||!L.img){toast('حدد طبقة صورة أولًا لتحويلها إلى فكتور');return;}
  const I=L.img,el=IMG.el[I.ref];
  if(!el){toast('تعذّر قراءة الصورة الحالية');return;}
  const btn=$('#pop [data-a="do-pixel-vector"]');
  if(btn){btn.disabled=true;btn.textContent='جارٍ التحويل…';}
  try{
    toast('جارٍ تحميل محرك تحويل البكسل إلى فكتور…',3000);
    const tracer=await loadImageTracer();
    const max=1600,scale=Math.min(1,max/Math.max(el.naturalWidth||I.nw,el.naturalHeight||I.nh));
    const w=Math.max(1,Math.round((el.naturalWidth||I.nw)*scale)),h=Math.max(1,Math.round((el.naturalHeight||I.nh)*scale));
    const c=newCanvas(w,h),ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(el,0,0,w,h);
    const data=ctx.getImageData(0,0,w,h);
    const colors=Math.max(2,Math.min(32,+S.pvColors||12));
    const pathomit=Math.max(0,Math.min(30,+S.pvPathomit==null?8:S.pvPathomit));
    const options={
      corsenabled:false,
      ltres:1,
      qtres:1,
      pathomit,
      rightangleenhance:true,
      colorsampling:2,
      numberofcolors:colors,
      mincolorratio:0,
      colorquantcycles:3,
      layering:0,
      strokewidth:0,
      linefilter:true,
      scale:1,
      roundcoords:2,
      viewbox:true
    };
    const svgText=tracer.imagedataToSVG(data,options);
    vectorizeSVGIntoLayer(svgText,(L.name||'صورة')+' — فكتور');
    toast('تم التحويل مع تنظيف الشوائب. الصورة الأصلية ما زالت موجودة.',4500);
    closePop();
  }catch(err){
    console.error('Pixel to Vector failed:',err);
    toast('تعذّر تحويل الصورة إلى فكتور. تأكد من اتصال الإنترنت ثم جرّب مرة أخرى.',6000);
  }finally{
    const b=$('#pop [data-a="do-pixel-vector"]');if(b){b.disabled=false;b.textContent='تحويل إلى فكتور';}
  }
}

function dataURLtoBlob(u){const [h,b]=u.split(','),mime=(h.match(/:(.*?);/)||[])[1]||'image/png',bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}

async function registerImage(ref,dataURL){

async function decodeImageFile(file){

}
LayerKinds.image.paint=function(lx,L,scale,white){

async function importImageFile(file,under){
  try{
    const src=await decodeImageFile(file);
    const w=src.width,h=src.height;if(!w||!h)throw new Error('صورة فاضية');
    const s0=Math.min(1,4096/Math.max(w,h)),cw=Math.max(1,Math.round(w*s0)),ch=Math.max(1,Math.round(h*s0));
    const c=newCanvas(cw,ch),x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,cw,ch);
    const d=x.getImageData(0,0,cw,ch).data;let alpha=false;for(let i=3;i<d.length;i+=4)if(d[i]<255){alpha=true;break;}
    const blob=await new Promise(r=>c.toBlob(r,alpha?'image/png':'image/jpeg',0.92));
    if(!blob)throw new Error('تعذّر ترميز الصورة');
    const ref=rid();await registerImage(ref,await blobToDataURL(blob));
    const sc=Math.min(Math.min(S.doc.w/cw,S.doc.h/ch),3);
    const L={id:rid(),kind:'image',name:file.name.replace(/\.[^.]+$/,'')||'صورة',vis:true,lock:false,op:1,blend:'normal',items:[],
      img:{ref,nw:cw,nh:ch,m:[sc,0,0,sc,(S.doc.w-cw*sc)/2,(S.doc.h-ch*sc)/2]}};
    if(under)S.doc.layers.unshift(L);
    else{const i=S.doc.layers.findIndex(l=>l.id===S.cur);S.doc.layers.splice(i>=0?i+1:S.doc.layers.length,0,L);}
    S.cur=L.id;S.sel=[];S.maskEdit=false;commit();setTool('select');render();renderLayers();renderBar();

    if(src.close)src.close();return true;
  }catch(err){toast('تعذّر إدراج الصورة: '+((err&&err.message)||'صيغة غير مدعومة'),4500);return false;}
}
async function removeCurrentImageBackground(){

function imageAction(a){

  const L=curLayer();if(!L||L.kind!=='image'||!L.img)return;const I=L.img,W=S.doc.w,H=S.doc.h;
  const c=mA(I.m,I.nw/2,I.nh/2);
  if(a==='imgFit'||a==='imgFill'||a==='img100'){
    const s=a==='imgFit'?Math.min(W/I.nw,H/I.nh):a==='imgFill'?Math.max(W/I.nw,H/I.nh):1;
    I.m=[s,0,0,s,(W-I.nw*s)/2,(H-I.nh*s)/2];
  }else if(a==='imgFlipH')I.m=mul([-1,0,0,1,2*c[0],0],I.m);
  else if(a==='imgFlipV')I.m=mul([1,0,0,-1,0,2*c[1]],I.m);
  else if(a==='imgRot')I.m=mul(mul(T(c[0],c[1]),mul(Ro(Math.PI/2),T(-c[0],-c[1]))),I.m);
  else if(a==='imgUnder'){
    const arr=S.doc.layers,sib=arr.filter(l=>(l.parent||null)===(L.parent||null)),first=sib[0];

function sampleImage(lid,p){
  const L=S.doc.layers.find(l=>l.id===lid);if(!L||!L.img)return null;
  const I=L.img,el=IMG.el[I.ref],m=I.m,det=m[0]*m[3]-m[1]*m[2];if(!el||!det)return null;
  const dx=p.x-m[4],dy=p.y-m[5],u=(m[3]*dx-m[2]*dy)/det,v=(-m[1]*dx+m[0]*dy)/det;

  if(a==='xfSnap'){S.xfSnap=!S.xfSnap;renderBar();drawUI();toast(S.xfSnap?'Snap شغال':'Snap متوقف');return true;}
  if(a==='xfGrid'){const vals=[4,8,16,32];const i=vals.indexOf(+S.xfGrid);S.xfGrid=vals[(i+1)%vals.length];renderBar();toast('شبكة الالتقاط: '+S.xfGrid+'px');return true;}
  if(a==='grad-linear'){S.gradientType='linear';renderBar();drawUI();return true;}
  if(a==='grad-radial'){S.gradientType='radial';renderBar();drawUI();return true;}
  if(a==='grad-reverse'){const f=S.sel.length===1&&findItem(S.sel[0]),g=f&&f.it&&f.it.grad;if(g){g.stops=(Array.isArray(g.stops)&&g.stops.length>=2?g.stops:[{o:0,c:g.c1||f.it.fill||'#000'},{o:1,c:g.c2||'#fff'}]).map(q=>({o:1-q.o,c:q.c})).sort((x,y)=>x.o-y.o);g.c1=g.stops[0].c;g.c2=g.stops[g.stops.length-1].c;S.gradientStop=0;commit();render();drawUI();renderBar();}return true;}
  if(a==='grad-add'){const f=S.sel.length===1&&findItem(S.sel[0]),g=f&&f.it&&f.it.grad;if(g){const arr=(Array.isArray(g.stops)&&g.stops.length>=2?g.stops:[{o:0,c:g.c1||f.it.fill||'#000'},{o:1,c:g.c2||'#fff'}]).slice().sort((x,y)=>x.o-y.o),idx=Math.min(Math.max(0,S.gradientStop),arr.length-2),a0=arr[idx],b0=arr[idx+1],o=(a0.o+b0.o)/2;const hex=mixHex(a0.c,b0.c,.5);arr.push({o,c:hex});arr.sort((x,y)=>x.o-y.o);g.stops=arr;g.c1=arr[0].c;g.c2=arr[arr.length-1].c;S.gradientStop=arr.findIndex(q=>q.o===o);S.colorTarget='gradient';commit();render();drawUI();renderBar();openPop('color');}return true;}
  if(a==='grad-del'){const f=S.sel.length===1&&findItem(S.sel[0]),g=f&&f.it&&f.it.grad;if(g){const arr=(Array.isArray(g.stops)&&g.stops.length>=2?g.stops:[{o:0,c:g.c1||f.it.fill||'#000'},{o:1,c:g.c2||'#fff'}]).slice().sort((x,y)=>x.o-y.o);if(arr.length>2){arr.splice(Math.min(S.gradientStop,arr.length-1),1);g.stops=arr;g.c1=arr[0].c;g.c2=arr[arr.length-1].c;S.gradientStop=Math.max(0,Math.min(S.gradientStop,arr.length-1));commit();render();drawUI();renderBar();}}return true;}
  if(a==='selMode'){S.selo.mode=S.selo.mode==='touch'?'inside':'touch';if(S.region)selectByRegion(false);renderBar();return true;}
  if(a==='selScope'){S.selo.scope=S.selo.scope==='layer'?'all':'layer';if(S.region)selectByRegion(false);renderBar();return true;}
  if(a==='selAdd'){S.selo.add=!S.selo.add;renderBar();return true;}
  if(a==='selOpt'){openPop('selopts');return true;}
  if(a==='selAll'){selectAllObjs();return true;}
  if(a==='selInv'){invertSelObjs();return true;}
  if(a==='selNone'){selectNoneObjs();return true;}
  if(a==='selGrow'){growRegion(1);return true;}
  if(a==='selShrink'){growRegion(-1);return true;}
  if(a==='selClear'){clearRegion();return true;}
  if(a==='objMask'){makeObjectMask();return true;}
  if(a==='objRelease'){releaseObjectMask();return true;}
  if(a==='copy'&&REGION_TOOLS.includes(S.tool)){copySel();return true;}
  if(a==='cut'){cutSel();return true;}
  if(a==='paste'){pasteSel(false);return true;}
  if(a==='toSelect'){setTool('select');return true;}
  if(a==='polyDone'){finishPoly();return true;}
  if(a.startsWith('xf:')){setXfMode(a.slice(3));return true;}
  if(a==='xfNum'){openPop('xfnum');return true;}
  if(a==='guidesPop'){openPop('guides');return true;}
  if(a==='symPop'){openPop('sym');return true;}
  if(['gHide','gDel','gRotP','gRotM','gBig','gSmall'].includes(a)){guideAction(a);return true;}
  return false;
}
function extraOverlays(k){
  let h=symOverlay(k)+guideOverlay(k);
  if(S.region)for(const pl of S.region.polys)h+=`<polygon class="ants" points="${pl.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="rgba(74,163,255,.08)" stroke="#fff" stroke-width="${1.5*k}" stroke-dasharray="${6*k} ${6*k}" pointer-events="none"/>`;
  if(S.polysel&&S.polysel.pts.length){
    const P=S.polysel.pts;
    h+=`<polyline points="${P.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#e5566b" stroke-width="${1.5*k}" pointer-events="none"/>`+P.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${(i?4:7)*k}" fill="${i?'#fff':'#e5566b'}" pointer-events="none"/>`).join('');
  }
  if(S.sel.length&&S.tool!=='select'&&S.tool!=='node'){
    for(const id of S.sel){const f=findItem(id);if(!f)continue;const b=subsBounds(f.it.subs);if(!b)continue;

async function routeFiles(list){
  const brushes=[],fonts=[],arts=[],imgs=[];
  for(const f of list){
    const n=f.name.toLowerCase();
    if(/\.(png|jpe?g|webp|gif|bmp)$/.test(n)||(/^image\//.test(f.type)&&!/svg/.test(f.type)))imgs.push(f);
    else if(/\.(przp|prbr)$/.test(n))brushes.push(f);
    else if(/\.(ttf|otf|woff)$/.test(n))fonts.push(f);
    else if(/\.vpaint$/.test(n))await loadProject(f);
    else if(/\.svg$/.test(n))arts.push(f);
    else brushes.push(f);
  }
  for(const f of imgs)await importImageFile(f,true);
  if(brushes.length)await importBrushFiles(brushes);
  for(const f of fonts)await addFontFile(f);
  for(const f of arts)await importArtwork(f);
}
document.addEventListener('dragover',e=>{e.preventDefault();});
document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)routeFiles([...e.dataTransfer.files]);});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.isoObj){S.isoObj=null;S.sel=[];render();renderLayers();renderBar();e.preventDefault();return;}
  if(e.key==='Escape'&&S.isoGroup){S.isoGroup=null;S.sel=[];render();renderLayers();renderBar();e.preventDefault();return;}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(c&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(c&&k==='y'){e.preventDefault();redo();}
  else if(c&&k==='a'){e.preventDefault();selectAllObjs();}
  else if(c&&k==='c'){e.preventDefault();copySel();}
  else if(c&&k==='x'){e.preventDefault();cutSel();}
  else if(c&&k==='v'){e.preventDefault();pasteSel(e.shiftKey);}
  else if(c&&k==='d'){e.preventDefault();dupSel();}
  else if(c&&k==='g'&&!e.shiftKey){e.preventDefault();groupObjects();}
  else if(c&&k==='g'&&e.shiftKey){e.preventDefault();ungroupObjects();}
  else if(c&&k==='s'){e.preventDefault();download(fname()+'.vpaint',new Blob([projectJSON()],{type:'application/json'}));S.dirty=false;}

  else if(k==='enter'&&S.polysel)finishPoly();
  else if(k==='enter'&&S.pen)finishPen(false);
  else if(k==='escape'){if(S.pop)closePop();else{S.pen=null;S.polysel=null;S.region=null;S.sel=[];S.node=null;renderBar();drawUI();}}
  else if(!c&&S.tool==='select'&&S.sel.length&&['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();const step=e.shiftKey?10:1;moveSelectionBy(k==='arrowleft'?-step:k==='arrowright'?step:0,k==='arrowup'?-step:k==='arrowdown'?step:0);}

  else if(!c){const map={s:'smudge',v:'select',a:'node',b:'brush',p:'pen',r:'rect',e:'ellipse',l:'line',t:'text',x:'eraser',i:'pick',h:'hand'};if(map[k])setTool(map[k]);}

/* ---------- storage: IndexedDB (meta = list data, data = full project JSON) ---------- */
const PDB={db:null,ok:true,
  open(){
    if(PDB.db)return Promise.resolve(PDB.db);
    return new Promise((res,rej)=>{
      if(typeof indexedDB==='undefined'||!indexedDB){PDB.ok=false;return rej(new Error('no-idb'));}
      let r;try{r=indexedDB.open('reesha-projects',2);}catch(e){PDB.ok=false;return rej(e);}
      r.onupgradeneeded=()=>{const d=r.result;for(const n of ['meta','data','folders','fonts'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});};
      r.onsuccess=()=>{PDB.db=r.result;PDB.db.onversionchange=()=>{try{PDB.db.close();}catch(_){}PDB.db=null;};res(PDB.db);};
      r.onerror=()=>{PDB.ok=false;rej(r.error);};
      r.onblocked=()=>rej(new Error('blocked'));
    });
  }
};
const pdbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const pdbTx=(db,names,mode,fn)=>new Promise((res,rej)=>{
  const tx=db.transaction(names,mode);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'));
  fn(tx);
});
async function pdbAllMeta(){const db=await PDB.open();return pdbReq(db.transaction('meta').objectStore('meta').getAll());}
async function pdbAllFolders(){const db=await PDB.open();return pdbReq(db.transaction('folders').objectStore('folders').getAll());}
async function pdbGetData(id){const db=await PDB.open();const r=await pdbReq(db.transaction('data').objectStore('data').get(id));return r?r.json:null;}
async function pdbGetMeta(id){const db=await PDB.open();return pdbReq(db.transaction('meta').objectStore('meta').get(id));}
async function pdbPut(meta,json){const db=await PDB.open();return pdbTx(db,['meta','data'],'readwrite',tx=>{tx.objectStore('meta').put(meta);if(json!=null)tx.objectStore('data').put({id:meta.id,json});});}
async function pdbPutMeta(meta){const db=await PDB.open();return pdbTx(db,['meta'],'readwrite',tx=>{tx.objectStore('meta').put(meta);});}
async function pdbDel(id){const db=await PDB.open();return pdbTx(db,['meta','data'],'readwrite',tx=>{tx.objectStore('meta').delete(id);tx.objectStore('data').delete(id);});}
async function pdbPutFolder(f){const db=await PDB.open();return pdbTx(db,['folders'],'readwrite',tx=>{tx.objectStore('folders').put(f);});}
async function pdbDelFolder(id){const db=await PDB.open();return pdbTx(db,['folders'],'readwrite',tx=>{tx.objectStore('folders').delete(id);});}

/* ---------- autosave of the open project ---------- */
let _saveT=0,_saving=Promise.resolve();
function hmThumb(){
  try{
    const sc=Math.min(1,320/Math.max(S.doc.w,S.doc.h)),d=Object.assign({},S.doc,{images:IMG.data});
    return renderCanvas(d,sc,S.doc.bg==='none'?'#ffffff':(S.doc.bg||'#ffffff')).toDataURL('image/jpeg',.72);
  }catch(_){return null;}
}
function scheduleSave(){
  if(!S.pid||!PDB.ok)return;
  clearTimeout(_saveT);
  _saveT=setTimeout(()=>{if(S.live||S.sedit||S.tedit||(S.drag&&S.drag.k)){scheduleSave();return;}saveNow();},Math.min(15000,Math.max(1800,(S._saveDur||0)*5)));
}
function saveNow(){
  clearTimeout(_saveT);
  const pid=S.pid;if(!pid||!PDB.ok)return _saving;
  _saving=_saving.then(async()=>{
    if(S.pid!==pid)return;
    try{
      teGuardOn();const t0=performance.now(),prev=S.pmeta||{},now=Date.now();
      const meta=Object.assign({},prev,{id:pid,name:S.doc.name||'بدون عنوان',w:S.doc.w,h:S.doc.h,updated:now,created:prev.created||now,thumb:hmThumb()||prev.thumb||null});
      const json=projectJSON();teGuardOff();await pdbPut(meta,json);
      S.pmeta=meta;S.dirty=false;S._saveWarned=false;S._saveDur=performance.now()-t0;
    }catch(_){
      teGuardOff();if(!S._saveWarned){S._saveWarned=true;toast('تعذّر الحفظ التلقائي — صدّر نسخة احتياطية من قائمة المشاريع',5000);}
    }
  });
  return _saving;
}
const flushSave=()=>{if(S.pid&&S.dirty)saveNow();};

    await _saving;clearTimeout(_saveT);S.pid=null;
    const cl=v=>Math.max(100,Math.min(10000,Math.round(+v||0)||1600));
    S.doc={w:cl(o.w),h:cl(o.h),bg:'#ffffff',name:(o.name||'').trim()||('لوحة '+(H.metas.length+1)),layers:[]};
    S.cur=null;S.sel=[];S.node=null;S.pen=null;addLayer('طبقة 1');S.hist=[];S.hi=-1;commit();S.dirty=false;
    const id=hmId();S.pid=id;S.pmeta={id,created:Date.now(),folder:o.folder||null};
    hmEnterEditor();
    if(o.image)await importImageFile(o.image,true);
    await saveNow();
  }catch(e){toast('تعذّر إنشاء المشروع',3500);}
}
async function hmImportFile(file,folder){
  try{
    if(S.pid)await saveNow();
    await _saving;clearTimeout(_saveT);const keep=S.pid;S.pid=null;
    const ok=await loadProject(file);
    if(!ok){S.pid=keep;return;}
    const id=hmId();S.pid=id;S.pmeta={id,created:Date.now(),folder:folder||null};S.dirty=false;
    hmEnterEditor();await saveNow();
  }catch(_){toast('تعذّر فتح الملف',3500);}
}
async function hmNewFromImage(f){
  try{
    const src=await decodeImageFile(f),w=src.width,h=src.height;if(!w||!h)throw 0;
    const s0=Math.min(1,4096/Math.max(w,h));
    await hmCreate({w:Math.round(w*s0),h:Math.round(h*s0),name:f.name.replace(/\.[^.]+$/,''),folder:H.folder,image:f});
  }catch(_){toast('تعذّر قراءة الصورة',3500);}
}
async function goHome(){
  if(S.sedit)seCommit();if(S.tedit)teCommit();
  try{closePop();}catch(_){}

}

/* ---------- library operations (data only; UI refresh afterwards) ---------- */
async function hmRenameProject(id,name){
  const m=await pdbGetMeta(id);if(!m)return;m.name=(name||'').trim()||m.name;await pdbPutMeta(m);
  const json=await pdbGetData(id);
  if(json){try{const o=JSON.parse(json);o.doc.name=m.name;await pdbPut(m,JSON.stringify(o));}catch(_){}}
}
async function hmDuplicate(id){
  const m=await pdbGetMeta(id),json=await pdbGetData(id);if(!m||!json)return;
  const nid=hmId(),now=Date.now();
  let j=json;try{const o=JSON.parse(json);o.doc.name=m.name+' (نسخة)';j=JSON.stringify(o);}catch(_){}
  await pdbPut(Object.assign({},m,{id:nid,name:m.name+' (نسخة)',created:now,updated:now}),j);
}
async function hmMoveProject(id,folder){const m=await pdbGetMeta(id);if(!m)return;m.folder=folder||null;await pdbPutMeta(m);}
async function hmDeleteProject(id){await pdbDel(id);}
async function hmFolderCreate(name){const f={id:'f'+hmId().slice(1),name:(name||'').trim()||'مجلد جديد',created:Date.now()};await pdbPutFolder(f);return f;}
async function hmFolderRename(id,name){const fs=await pdbAllFolders(),f=fs.find(x=>x.id===id);if(!f)return;f.name=(name||'').trim()||f.name;await pdbPutFolder(f);}
async function hmFolderDelete(id){
  for(const m of await pdbAllMeta())if(m.folder===id){m.folder=null;await pdbPutMeta(m);}
  await pdbDelFolder(id);
}
async function hmBackupBuild(){
  const metas=await pdbAllMeta(),folders=await pdbAllFolders(),projects=[];
  for(const m of metas)projects.push({meta:m,json:await pdbGetData(m.id)});
  return JSON.stringify({format:'reesha-backup',v:1,date:Date.now(),folders,projects});
}
async function hmBackupRestore(text){
  const o=JSON.parse(text);if(o.format!=='reesha-backup')throw new Error('bad');
  const have=new Map((await pdbAllMeta()).map(m=>[m.id,m]));let n=0;
  for(const f of o.folders||[])await pdbPutFolder(f);
  for(const p of o.projects||[]){
    if(!p||!p.meta||!p.json)continue;const cur=have.get(p.meta.id);
    if(!cur||(cur.updated||0)<(p.meta.updated||0)){await pdbPut(p.meta,p.json);n++;}
  }
  return n;
}

async function hmAct(act,b){
  const id=b&&b.dataset?b.dataset.id:'';
  try{
    if(act==='sheet-close')return hmSheetClose();
    if(act==='new-blank'){hmNewSheet();return;}
    if(act==='quick-size'){hmNewSheet(b.dataset.w,b.dataset.h);return;}
    if(act==='preset'){$('#hm-w').value=b.dataset.w;$('#hm-h').value=b.dataset.h;return;}
    if(act==='create'){const o={w:$('#hm-w').value,h:$('#hm-h').value,name:$('#hm-name').value,folder:H.folder};hmSheetClose();await hmCreate(o);return;}
    if(act==='new-image'){$('#hmImg').click();return;}
    if(act==='open-file'){$('#openFile').click();return;}
    if(act==='continue'){const r=H.metas.slice().sort((a,c)=>c.updated-a.updated)[0];if(r)await hmOpen(r.id);return;}
    if(act==='folder-back'){H.folder=null;hmRenderProjects();return;}
    if(act==='new-folder'){hmTextSheet('مجلد جديد','','folder-create','','إنشاء');return;}
    if(act==='folder-create'){await hmFolderCreate($('#hm-text').value);hmSheetClose();await homeRefresh();return;}
    if(act==='menu-backup'){hmSheet(`<h3>النسخة الاحتياطية</h3>${hmRow('backup-export','download','تصدير كل المشاريع في ملف')}${hmRow('backup-import','open','استيراد نسخة احتياطية')}<p class="hm-note">الأعمال محفوظة في متصفح الجهاز ده فقط. صدّر نسخة من وقت للتاني عشان تحميها لو مسحت بيانات الموقع.</p>`);return;}
    if(act==='backup-export'){const t=await hmBackupBuild(),d=new Date().toISOString().slice(0,10);download('reesha-backup-'+d+'.json',new Blob([t],{type:'application/json'}));hmSheetClose();return;}
    if(act==='backup-import'){hmSheetClose();$('#hmBackup').click();return;}
    if(act==='p-open'){hmSheetClose();await hmOpen(id);return;}
    if(act==='p-rename'){const m=H.metas.find(x=>x.id===id);hmTextSheet('إعادة تسمية',m?m.name:'','p-rename-do',id);return;}
    if(act==='p-rename-do'){await hmRenameProject(id,$('#hm-text').value);hmSheetClose();await homeRefresh();return;}
    if(act==='p-dup'){await hmDuplicate(id);hmSheetClose();await homeRefresh();toast('اتعمل نسخة');return;}
    if(act==='p-move'){hmSheet(`<h3>نقل إلى</h3>${hmRow('p-move-do','home','بدون مجلد',id)}${H.folders.map(f=>`<button class="hm-rb" data-act="p-move-do" data-id="${hmEsc(id)}" data-f="${hmEsc(f.id)}">${hmIcon('folder',22)}<span>${hmEsc(f.name)}</span></button>`).join('')}`);return;}
    if(act==='p-move-do'){await hmMoveProject(id,b.dataset.f||null);hmSheetClose();await homeRefresh();return;}
    if(act==='p-export'){const m=H.metas.find(x=>x.id===id),j=await pdbGetData(id);if(j)download((m?m.name:'project')+'.vpaint',new Blob([j],{type:'application/json'}));hmSheetClose();return;}
    if(act==='p-del'){const m=H.metas.find(x=>x.id===id);hmSheet(`<h3>حذف «${hmEsc(m?m.name:'')}»؟</h3><p class="hm-note">المشروع هيتمسح نهائيًا من الجهاز ده.</p><button class="hm-primary danger" data-act="p-del-do" data-id="${hmEsc(id)}">احذف</button><button class="hm-ghost" data-act="sheet-close">إلغاء</button>`);return;}
    if(act==='p-del-do'){await hmDeleteProject(id);hmSheetClose();await homeRefresh();return;}
    if(act==='f-rename'){const f=H.folders.find(x=>x.id===id);hmTextSheet('إعادة تسمية المجلد',f?f.name:'','f-rename-do',id);return;}
    if(act==='f-rename-do'){await hmFolderRename(id,$('#hm-text').value);hmSheetClose();await homeRefresh();return;}
    if(act==='f-del'){hmSheet(`<h3>حذف المجلد؟</h3><p class="hm-note">المشاريع اللي جواه مش هتتمسح، هترجع للرئيسية.</p><button class="hm-primary danger" data-act="f-del-do" data-id="${hmEsc(id)}">احذف المجلد</button><button class="hm-ghost" data-act="sheet-close">إلغاء</button>`);return;}
    if(act==='f-del-do'){await hmFolderDelete(id);if(H.folder===id)H.folder=null;hmSheetClose();await homeRefresh();return;}
  }catch(e){toast('حصلت مشكلة: '+((e&&e.message)||'غير معروفة'),4000);}
}
function hmInit(){
  const h=$('#home');if(!h)return;
  h.addEventListener('click',async e=>{
    const t=e.target;let b;
    if((b=t.closest('[data-tab]'))&&b.classList.contains('hm-tab')||(b=t.closest('.hm-link[data-tab]'))){hmTab(b.dataset.tab);return;}
    if((b=t.closest('[data-more]'))){e.stopPropagation();hmProjectMenu(b.dataset.more);return;}
    if((b=t.closest('[data-fmore]'))){e.stopPropagation();hmFolderMenu(b.dataset.fmore);return;}
    if((b=t.closest('[data-open]'))){hmOpen(b.dataset.open);return;}
    if((b=t.closest('[data-folder]'))){H.folder=b.dataset.folder;hmRenderProjects();return;}
    if((b=t.closest('[data-act]'))){await hmAct(b.dataset.act,b);return;}
  });
  $('#hmImg').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)hmNewFromImage(f);});
  $('#hmBackup').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const n=await hmBackupRestore(await f.text());await homeRefresh();toast(n?('اتستعاد '+n+' مشروع'):'مفيش جديد يتستعاد',3500);}
    catch(_){toast('الملف ده مش نسخة احتياطية صحيحة',3500);}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave();});
  window.addEventListener('pagehide',flushSave);
  window.addEventListener('popstate',()=>{if(!h.classList.contains('on')&&S.pid)goHome();});
  hmRenderDiscover();
  (async()=>{
    try{await PDB.open();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}
    await fontsLoadPersisted();
    await homeRefresh();homeShow('home');
  })();
}

/* ---------- font library (memory + IndexedDB 'fonts' store) ---------- */
async function pdbFontsAll(){const db=await PDB.open();if(!db.objectStoreNames.contains('fonts'))return [];return pdbReq(db.transaction('fonts').objectStore('fonts').getAll());}
async function pdbFontPut(r){const db=await PDB.open();return pdbTx(db,['fonts'],'readwrite',tx=>{tx.objectStore('fonts').put({id:r.id,name:r.name,buf:r.buf,src:r.src||'upload',date:Date.now()});});}
async function pdbFontDel(id){const db=await PDB.open();return pdbTx(db,['fonts'],'readwrite',tx=>{tx.objectStore('fonts').delete(id);});}
function fontFace(rec){try{const ff=new FontFace('f_'+rec.id,rec.buf.slice(0));ff.load().then(()=>document.fonts.add(ff)).catch(()=>{});}catch(_){}}
function fontAdd(rec){
  const i=S.lib.fonts.findIndex(f=>f.id===rec.id);
  if(i>=0)S.lib.fonts[i]=rec;else S.lib.fonts.push(rec);
  fontFace(rec);return rec;
}
function fontParse(buf,id,name,src){
  const obj=opentype.parse(buf);
  const nm=name||(obj.names&&obj.names.fullName&&(obj.names.fullName.ar||obj.names.fullName.en))||'خط';
  return {id,name:nm,buf,obj,src:src||'upload'};
}

/* ---------- layout: alignment, line height, tracking, direction ---------- */
function paragraphDir(str){
  for(const ch of String(str)){if(RTL_RE.test(ch))return 'rtl';if(/[A-Za-z]/.test(ch))return 'ltr';}
  return 'ltr';
}
function textLayout(font,str,o){
  const size=o.size,scale=size/font.unitsPerEm,vis=fontVisualOrder(font),lines=String(str).split('\n');
  const pdir=(o.dir&&o.dir!=='auto')?o.dir:paragraphDir(str);
  const align=(o.align&&o.align!=='auto')?o.align:(pdir==='rtl'?'right':'left');
  const lh=size*(o.lh||1.45),track=+o.track||0,laid=[];
  for(const line of lines){
    const gl=[];let w=0;
    for(const r of textRuns(line,pdir)){
      let g=font.stringToGlyphs(r.s);
      if(r.d==='rtl'&&!vis)g=g.slice().reverse();
      for(const x of g){const adv=(x.advanceWidth||0)*scale+(r.d==='ltr'?track:0);gl.push({g:x,adv});w+=adv;}
    }
    laid.push({gl,w});
  }
  const cmds=[];let by=o.y;
  for(const ln of laid){
    let cx=o.x-(align==='right'?ln.w:align==='center'?ln.w/2:0);
    for(const {g,adv} of ln.gl){
      const p=g.getPath(cx,by,size);
      for(const c of p.commands){
        if(c.type==='M')cmds.push({t:'M',x:c.x,y:c.y});
        else if(c.type==='L')cmds.push({t:'L',x:c.x,y:c.y});
        else if(c.type==='C')cmds.push({t:'C',x1:c.x1,y1:c.y1,x2:c.x2,y2:c.y2,x:c.x,y:c.y});
        else if(c.type==='Q'){
          const pv=lastPt(cmds);
          cmds.push({t:'C',x1:pv.x+2/3*(c.x1-pv.x),y1:pv.y+2/3*(c.y1-pv.y),x2:c.x+2/3*(c.x1-c.x),y2:c.y+2/3*(c.y1-c.y),x:c.x,y:c.y});
        }else if(c.type==='Z')cmds.push({t:'Z'});
      }
      cx+=adv;
    }
    by+=lh;
  }
  return cmdsToSubs(cmds);
}
function buildTextSubs(E){
  let font=S.lib.fonts.find(f=>f.id===E.fid);
  if(!font){font=S.lib.fonts.find(f=>f.id==='builtin')||S.lib.fonts[0];if(font&&!E._warned){E._warned=true;toast('الخط الأصلي مش متاح — استُخدم خط بديل');}}
  if(!font)return null;
  let subs=textLayout(font.obj,E.s,{size:E.size,lh:E.lh,track:E.track,align:E.align,dir:E.dir,x:E.x,y:E.y});
  if(E.tm)subs=xformSubs(subs,E.tm);
  return subs;
}

function tePreview(){

function teBoxMarkup(k){

<script>
/* V43 watercolor wet interaction enhancement */
(function(){
  if(window.__v43Wet) return; window.__v43Wet=true;
  const old=window.strokeSubs;
  if(typeof old!=='function') return;
  window.strokeSubs=function(raw,br){
    const out=old(raw,br);
    if(!br || !['water','water-soft'].includes(br.kind)) return out;
    const pts=raw&&raw.pts?raw.pts:raw;
    if(!Array.isArray(pts)||pts.length<2) return out;
    const wet=br.wetMode||'wet-dry';
    const extra=[];
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1],b=pts[i];
      const dx=b.x-a.x,dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len;
      const base=(br.size||40)*.5;
      const alpha=(br.flow||.5)*.10;
      const layers=wet==='wet-wet'?3:1;
      for(let k=0;k<layers;k++){
        const spread=base*(.7+k*.22);
        const x=b.x+nx*(k-layers/2)*base*.28;
        const y=b.y+ny*(k-layers/2)*base*.28;
        const path=`M ${x.toFixed(2)} ${(y-spread).toFixed(2)} C ${(x+spread).toFixed(2)} ${(y-spread*.65).toFixed(2)} ${(x+spread).toFixed(2)} ${(y+spread*.65).toFixed(2)} ${x.toFixed(2)} ${(y+spread).toFixed(2)} C ${(x-spread).toFixed(2)} ${(y+spread*.65).toFixed(2)} ${(x-spread).toFixed(2)} ${(y-spread*.65).toFixed(2)} ${x.toFixed(2)} ${(y-spread).toFixed(2)} Z`;
        extra.push({d:path,fill:((typeof S!=='undefined'&&S.st&&S.st.fill)||'#111'),opacity:alpha*(wet==='wet-wet'?0.7:1),type:'path',it:{kind:'path',d:path,fill:((typeof S!=='undefined'&&S.st&&S.st.fill)||'#111'),opacity:alpha*(wet==='wet-wet'?0.7:1)}});
      }
    }
    return out.concat(extra);
  };
})();
